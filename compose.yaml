services:
  team-room:
    build: .
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4173
      TEAM_ROOM_HUB_ONLY: 1
      TEAM_ROOM_SETUP_TOKEN: ${TEAM_ROOM_SETUP_TOKEN:?Run npm run setup first}
      TEAM_ROOM_TRUST_PROXY: 1
      TEAM_ROOM_DATA_DIR: /data
      PUBLIC_URL: https://${TEAM_ROOM_DOMAIN}
    volumes:
      - team-room-data:/data
    expose:
      - 4173
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4173/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      TEAM_ROOM_DOMAIN: ${TEAM_ROOM_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      team-room:
        condition: service_healthy
volumes:
  team-room-data:
  caddy-data:
  caddy-config:
